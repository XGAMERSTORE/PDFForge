plugins { id 'com.android.application' }

android {
    namespace 'com.xgamerstore.pdfforge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xgamerstore.pdfforge'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        resourceConfigurations += ['en','cs','sk','de','fr','es','it','pt','pl','nl','sv','ro','hu','tr','uk','ru','ar','hi','id','vi','ja','ko','zh']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            // Release bundle is UNSIGNED unless a private upload key is configured.
            // Never commit Play signing keys into version control.
        }
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.android.billingclient:billing:8.3.0'
}
