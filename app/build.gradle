plugins { id 'com.android.application' }

android {
    namespace 'com.xgamerstore.pdfforge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xgamerstore.pdfforge'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        resourceConfigurations += ['en','cs','sk','de','fr','es','it','pt','pl','nl','sv','ro','hu','tr','uk','ru','ar','hi','id','vi','ja','ko','zh']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release bundle is UNSIGNED unless a private upload key is configured.
            // Never commit Play signing keys into version control.
        }
    }
    packaging {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE', 'META-INF/LICENSE.txt',
            'META-INF/NOTICE', 'META-INF/NOTICE.txt',
            'META-INF/INDEX.LIST',
            'META-INF/*.kotlin_module'
        ]
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.android.billingclient:billing:8.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
}
